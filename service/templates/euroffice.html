<div id="editor-<%= editorConfig.user.id %>"></div>
<script type="text/javascript" src="<%= documentServerUrl %>/web-apps/apps/api/documents/api.js"></script>
<script>
  const config = {
    document: {
      fileType: "<%= document.fileType %>",
      key: "<%= document.key %>",
      title: "<%= document.title %>",
      url: "<%= document.url %>",
      documentType: "<%= document.documentType %>"
    },
    editorConfig: {
      mode: "<%= editorConfig.mode %>",
      lang: "<%= editorConfig.lang %>",
      callbackUrl: "<%= editorConfig.callbackUrl %>",
      user: {
        id: "<%= editorConfig.user.id %>",
        name: "<%= editorConfig.user.name %>"
      },
      customization: {
        uiTheme: "<%= editorConfig.customization.uiTheme %>"
      }
    },
    documentServerUrl: "<%= documentServerUrl %>",<% if (typeof shareEditRequest !== 'undefined' && shareEditRequest) { %>
    // Secure-share recipient in the forced read-only editor. api.js derives
    // editorConfig.canRequestEditRights from the mere PRESENCE of this handler, and
    // that flag is what makes OnlyOffice offer "Edit document" in view mode. Tell the
    // Drumee parent so it can open the share's Request Access / sign-up flow, then
    // leave the document read-only: edit permission is decided server-side from the
    // share token, so this handler must never grant rights itself.
    events: {
      onRequestEditRights: function () {
        try {
          // The payload carries no identifier and no secret — only "the viewer asked
          // to edit" — so a wildcard target is safe here. The Drumee page validates
          // the sender origin against the editor URL before acting on the message.
          //
          // Posts to window.top AND window.parent: `parent` is only the Drumee page
          // when this document is exactly one frame deep, which is not guaranteed,
          // while `top` is the outermost window in every nesting. Both are sent
          // because either one alone can be the wrong target; the Drumee side
          // de-duplicates, so a double delivery opens a single dialog.
          var msg = { event: "drumee:requestEditRights" };
          var sent = [];
          [window.top, window.parent].forEach(function (w) {
            if (!w || w === window || sent.indexOf(w) !== -1) return;
            sent.push(w);
            try { w.postMessage(msg, "*"); } catch (err) { /* keep trying the other */ }
          });
        } catch (e) {
          // Never let a messaging failure break the editor; it stays read-only.
        }
      }
    },<% } %>
    token: "<%= token %>"
  }
  const docEditor = new DocsAPI.DocEditor("editor-<%= editorConfig.user.id %>", config); 
</script>
